<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" fill="none" role="img"><title>Luiz Henrique — automação, integrações e chatbots</title><style>.in{opacity:0;animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.role{opacity:0;animation:role 9s infinite}@keyframes role{0%{opacity:0;transform:translateY(12px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-12px)}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .5s cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.edge{stroke-dasharray:4 6;animation:flow 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style>
